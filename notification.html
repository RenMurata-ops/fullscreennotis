<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .notification-container {
      text-align: center;
      padding: 60px;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .icon {
      font-size: 120px;
      margin-bottom: 40px;
      animation: bounce 1s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    .datetime {
      font-size: 36px;
      font-weight: 300;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .message {
      font-size: 48px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 60px;
      max-width: 1200px;
      word-wrap: break-word;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .close-button {
      padding: 20px 50px;
      font-size: 24px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid white;
      border-radius: 50px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .close-button:hover {
      background: white;
      color: #667eea;
      transform: scale(1.05);
    }

    .fullscreen-button {
      padding: 20px 50px;
      font-size: 24px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.9);
      border: 3px solid white;
      border-radius: 50px;
      color: #667eea;
      cursor: pointer;
      transition: all 0.3s;
    }

    .fullscreen-button:hover {
      background: white;
      transform: scale(1.05);
    }

    .countdown {
      margin-top: 30px;
      font-size: 18px;
      opacity: 0.7;
    }

    .fullscreen-hint {
      margin-top: 20px;
      font-size: 16px;
      opacity: 0.8;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="notification-container">
    <div class="icon">🔔</div>
    <div class="datetime" id="datetime"></div>
    <div class="message" id="message"></div>
    <div class="buttons">
      <button class="fullscreen-button" id="fullscreenBtn">フルスクリーンで表示</button>
      <button class="close-button" id="closeBtn">閉じる</button>
    </div>
    <div class="fullscreen-hint" id="hint">
      フルスクリーンで表示することをおすすめします
    </div>
    <div class="countdown" id="countdown"></div>
  </div>

  <script>
    let autoCloseSeconds = 60;
    let countdownInterval;
    let isFullscreen = false;

    // 通知データを読み込んで表示
    function loadNotification() {
      const scheduleData = sessionStorage.getItem('currentNotification');

      if (!scheduleData) {
        // データがない場合はホームに戻る
        window.location.href = 'index.html';
        return;
      }

      try {
        const schedule = JSON.parse(scheduleData);

        // 日時を表示
        const date = new Date(schedule.datetime);
        document.getElementById('datetime').textContent = date.toLocaleString('ja-JP', {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        // メッセージを表示
        document.getElementById('message').textContent = schedule.message;

        // sessionStorageから削除（一度きり）
        sessionStorage.removeItem('currentNotification');

        // カウントダウンを開始
        startCountdown();
      } catch (error) {
        console.error('通知データの読み込みエラー:', error);
        window.location.href = 'index.html';
      }
    }

    // フルスクリーン切り替え
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          isFullscreen = true;
          document.getElementById('fullscreenBtn').textContent = 'フルスクリーン解除';
          document.getElementById('hint').style.display = 'none';
        }).catch(err => {
          console.error('フルスクリーンエラー:', err);
          alert('フルスクリーン表示に失敗しました。ブラウザの設定をご確認ください。');
        });
      } else {
        document.exitFullscreen();
        isFullscreen = false;
        document.getElementById('fullscreenBtn').textContent = 'フルスクリーンで表示';
        document.getElementById('hint').style.display = 'block';
      }
    }

    // カウントダウンの開始
    function startCountdown() {
      updateCountdown();
      countdownInterval = setInterval(() => {
        autoCloseSeconds--;
        if (autoCloseSeconds <= 0) {
          closeNotification();
        } else {
          updateCountdown();
        }
      }, 1000);
    }

    // カウントダウン表示の更新
    function updateCountdown() {
      document.getElementById('countdown').textContent =
        `${autoCloseSeconds}秒後に自動的に閉じます`;
    }

    // 通知を閉じる
    function closeNotification() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      // フルスクリーンを解除
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }

      // ホームに戻る
      window.location.href = 'index.html';
    }

    // イベントリスナー
    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
    document.getElementById('closeBtn').addEventListener('click', closeNotification);

    // ESCキーで閉じる（フルスクリーンでない場合のみ）
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.fullscreenElement) {
        closeNotification();
      }
    });

    // フルスクリーン状態の変化を検知
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        isFullscreen = false;
        document.getElementById('fullscreenBtn').textContent = 'フルスクリーンで表示';
        document.getElementById('hint').style.display = 'block';
      }
    });

    // ページ読み込み時に通知を表示
    document.addEventListener('DOMContentLoaded', loadNotification);
  </script>
</body>
</html>
